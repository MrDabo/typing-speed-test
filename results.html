<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, inital-scale=1.0" />
    <link rel="stylesheet" href="css/global.css">
    <link rel="stylesheet" href="css/header.css">
    <link rel="stylesheet" href="css/results.css">
  </head>
  <body>
    <header>
      <figure class="logo">
        <img
          src="assets/images/logo-small.svg"
          alt="logo"
          title="Typing Speed Test"
          class="mobile"
        />
        <img
          src="assets/images/logo-large.svg"
          alt="logo"
          title="Typing Speed Test"
          class="desktop"
        />
      </figure>

      <figure class="best">
        <img src="assets/images/icon-personal-best.svg" alt="" />
        <figcaption>
          <span>Personal</span>Best:<b id="best-value">92WPM</b>
        </figcaption>
      </figure>
    </header>
    <main>
        <figure>
            <img src="assets/images/icon-completed.svg" alt="">
            <figcaption>Test Complete!</figcaption>
        </figure>
        <p>Solid run. Keep pusing to beat you high score.</p>
        <section>
            <div>
                <p class="label">WPM:</p>
                <p class="value">85</p>
            </div>
            <div>
                <p class="label">Accuracy:</p>
                <p class="value">90%</p>
            </div>
            <div>
                <p class="label">Characters:</p>
                <p class="value">120/5</p>
            </div>
        </section>
        <button>Go Again <img src="assets/images/icon-restart.svg" alt=""></button>
    </main>
  </body>
</html>
