<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta name="author" content="Umar dabo">
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="css/global.css" />
    <link rel="stylesheet" href="css/header.css" />
    <link rel="stylesheet" href="css/home.css" />
    <link rel="stylesheet" href="css/utilities.css">
    <script type="module" src="javascript/components.js"></script>
    <script type="module" src="javascript/home.js"></script>
    <title>Typing Speed Tdest</title>
  </head>

  <body>
    <main>
      <aside>
        <section class="details">
          <p>
            <span class="label">WPM:</span><span class="value" id="wpm">0</span>
          </p>
          <p>
            <span class="label">Accuracy:</span
            ><span class="value" id="accuracy">100%</span>
          </p>
          <p>
            <span class="label">Time:</span
            ><span class="value" id="time">0:60</span>
          </p>
        </section>
        <section class="controls-desktop">
          <div>
            <p>Difficulty:</p>
            <button class="selected difficulty-button">Easy</button>
            <button class="difficulty-button">Medium</button>
            <button class="difficulty-button">Hard</button>
          </div>
          <div>
            <p>Mode:</p>
            <button class="selected mode-button">Timed(60s)</button>
            <button class="mode-button">Passage</button>
          </div>
        </section>
        <section class="controls-mobile">
          <select id="difficulty-select">
            <option value="easy" selected>Easy</option>
            <option value="medium">Medium</option>
            <option value="hard">Hard</option>
          </select>
          <select id="mode-select">
            <option value="timed" selected>Timed(60s)</option>
            <option value="passage">Passage</option>
          </select>
        </section>
      </aside>
      <section id="text-area" class="text-area">
        <div>
          <button>Start Typing Text</button>
          <p>Or click the text and start typing</p>
        </div>
        <article>
          Lorem, ipsum dolor sit amet consectetur adipisicing elit. Distinctio
          ab, odit nulla aperiam omnis aspernatur officiis corporis molestias
          ratione totam? Sapiente quia vitae consequatur consectetur quis sint.
          Ea
        </article>
        <button>Restart Test</button>
      </section>
    </main>
  </body>
</html>
